name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: Linting
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Install node dependencies
        working-directory: ${{ github.workspace}}
        run: pnpm install

      - name: Run linting
        working-directory: ${{ github.workspace}}
        run: pnpm lint

  unit-tests:
    name: Unit tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Install node dependencies
        working-directory: ${{ github.workspace}}
        run: pnpm install

      - name: Run tests
        working-directory: ${{ github.workspace}}
        run: pnpm test

  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Install node dependencies
        working-directory: ${{ github.workspace}}
        run: pnpm install

      - name: Build
        working-directory: ${{ github.workspace}}
        run: pnpm build
